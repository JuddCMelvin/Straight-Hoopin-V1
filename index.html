<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Straight Hooping</title>
    <script src="main.js"></script>
    <link rel="stylesheet" href="/CSS/style.css">
</head>
<body>
    <main>
        <section id="gameScreen">
            <h1 class="header" id="header">Straight Hoopin</h1>
            <nav class="controls">
                <div class="nav_display">
                    <button class="button" id="startGameButton">Start Game</button>
                    <button class="button" id="reset">reset</button>
                    <div id="scoreBoard">Score:<span>0</span></div>
                    <div id="result"></div>
                    <div id="shotClock">Shot Clock: <span id="timer"></span></div>
                </div>
            </nav>
            <div class="container">
                <div class="game-screen game-screen1" id="gameScreen1">
                    <div id="basket">
                        <img src="Assets/goal.png">
                        <div class="backboard"></div>
                    </div>
                    <div class="ball">
                    </div>
                    <div id="hand">
                        <img src="Assets/player.png" alt="Hand Image">
                    </div>
                </div>
            </div>
            <script src="main.js"></script>
            <!-- <script src="shot.js"></script> -->
        </section>
    </main>
</body>
</html>
